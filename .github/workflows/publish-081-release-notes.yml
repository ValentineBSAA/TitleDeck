name: Publish verified 0.8.1 release notes
on:
  push:
    paths:
      - '.github/workflows/publish-081-release-notes.yml'
      - 'docs/RELEASE_NOTES_0.8.1.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-release:
    if: github.repository == 'ValentineBSAA/TitleDeck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize prerelease description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit 0.8.1 \
            --repo "$GITHUB_REPOSITORY" \
            --title "TitleDeck v0.8.1 — Steam Deck Test Release" \
            --notes-file docs/RELEASE_NOTES_0.8.1.md \
            --prerelease
