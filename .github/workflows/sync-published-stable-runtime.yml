name: Synchronize published stable runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-published-stable-runtime.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'ValentineBSAA/TitleDeck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify published release checksum and sync authoritative runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --output /tmp/titledeck-stable.zip 'https://github.com/ValentineBSAA/TitleDeck/releases/download/0.9.2/TitleDeck-0.9.2.zip'
          echo '28fdbfc6f2d15f991bf98c7dc471d19be3142cd84269a9bba60d1147b420efdb  /tmp/titledeck-stable.zip' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib,json
          with ZipFile('/tmp/titledeck-stable.zip') as z:
              assert z.testzip() is None
              for name in ('plugin.json','package.json','main.py','dist/index.js'):
                  Path(name).write_bytes(z.read('TitleDeck/'+name))
              Path('src/index.js').write_bytes(z.read('TitleDeck/dist/index.js'))
          assert json.loads(Path('plugin.json').read_text())['version']=='0.9.2'
          assert json.loads(Path('package.json').read_text())['version']=='0.9.2'
          assert Path('src/index.js').read_bytes()==Path('dist/index.js').read_bytes()
          p=Path('tests/test_repo_docs.py')
          s=p.read_text()
          import re
          old='804b0e3437ac5b194d00102e0e5a390ac50bf92471599d2001892b7b7f970ed1'
          new=hashlib.sha256(Path('src/index.js').read_bytes()).hexdigest()
          if old not in s and new not in s:raise SystemExit('Unknown pinned source checksum; refusing to change test')
          p.write_text(s.replace(old,new))
          print('Stable runtime checksum:',new)
          PY
      - name: Run complete local tests before publishing
        run: |
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Commit only authoritative runtime parity changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugin.json package.json main.py src/index.js dist/index.js tests/test_repo_docs.py
          if git diff --cached --quiet; then echo 'Already synchronized'; exit 0; fi
          git commit -m 'release: synchronize stable 0.9.2 repository with published ZIP runtime'
          git pull --rebase origin main
          git push origin HEAD:main
