name: Align 0.9.2 beta source tag

on:
  push:
    paths:
      - '.github/workflows/align-092-beta-tag.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align-beta-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify source is exactly published beta
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          manifest = json.loads(Path('plugin.json').read_text())
          package = json.loads(Path('package.json').read_text())
          assert manifest['version'] == package['version'] == '0.9.2-beta.1'
          expected = '2a735efe47df5e35c72d26420bf485f718cc1ab7bd0a7f4063e171686025bf7c'
          actual = hashlib.sha256(Path('dist/index.js').read_bytes()).hexdigest()
          assert actual == expected, f'Runtime does not match published beta: {actual}'
          assert Path('src/index.js').read_bytes() == Path('dist/index.js').read_bytes()
          print('Source matches published beta installer')
          PY
      - name: Move only the beta tag from its initial pre-sync commit
        shell: bash
        run: |
          set -eu
          current="$(git ls-remote origin 'refs/tags/0.9.2-beta.1' | cut -f1)"
          expected='656c266818bdea15614499e0d9b7a9644aab6d3a'
          target="$(git rev-parse HEAD)"
          if [ "$current" = "$target" ]; then
            echo "Beta tag already points to synchronized source"
            exit 0
          fi
          if [ "$current" != "$expected" ]; then
            echo "Beta tag was changed externally; refusing to overwrite $current"
            exit 1
          fi
          git push --force-with-lease="refs/tags/0.9.2-beta.1:$expected" origin "HEAD:refs/tags/0.9.2-beta.1"
          echo "Updated 0.9.2-beta.1 tag to $target"
