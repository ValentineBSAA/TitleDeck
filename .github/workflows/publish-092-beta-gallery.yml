name: Publish curated 0.9.2 Beta 1 screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-092-beta-gallery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-gallery:
    if: github.repository == 'ValentineBSAA/TitleDeck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and package beta screenshot evidence
        run: |
          python3 - <<'PY'
          import hashlib
          import zipfile
          from pathlib import Path
          base = Path('docs/screenshots/v0.9.2-beta1')
          expected = {
            '01-quick-access-beta-version.jpeg': '332f161355e0c7aad0cb11952db47c2ab97a2cbcadb431f8022c958fcbf03ebc',
            '02-native-game-info-description.jpeg': '5325d977433bb365746685fe7fb4cde1993eba4e20a58e3f8c3d9f89f09373a9',
            '03-long-description-end.jpeg': '01afe1a6222bcd82be2e8ee0ac6ed505afcab44e504f436d62766929bdffb2f2',
          }
          out = Path('/tmp/TitleDeck-0.9.2-Beta1-Screenshots.zip')
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
            for name, digest in expected.items():
              content = (base / name).read_bytes()
              assert content.startswith(bytes.fromhex('ffd8ff')), name
              assert hashlib.sha256(content).hexdigest() == digest, name
              info = zipfile.ZipInfo('TitleDeck-0.9.2-Beta1-Screenshots/' + name, (2026, 10, 25, 0, 0, 0))
              info.compress_type = zipfile.ZIP_DEFLATED
              info.external_attr = 0o644 << 16
              z.writestr(info, content, compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          with zipfile.ZipFile(out) as z:
            assert z.testzip() is None and len(z.namelist()) == 3
          print('Screenshot ZIP sha256:', hashlib.sha256(out.read_bytes()).hexdigest())
          PY
      - name: Attach curated screenshots without modifying the beta installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file='TitleDeck-0.9.2-Beta1-Screenshots.zip'
          if gh release view 0.9.2-beta.1 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$file"; then
            echo 'Screenshot asset already exists; preserving it.'
          else
            gh release upload 0.9.2-beta.1 "/tmp/$file" --repo "$GITHUB_REPOSITORY"
          fi
          gh release view 0.9.2-beta.1 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | [.name, .size] | @tsv'
