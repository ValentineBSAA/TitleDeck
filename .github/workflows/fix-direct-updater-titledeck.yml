name: Fix Direct Updater compatibility (TitleDeck)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-direct-updater-titledeck.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-release-metadata:
    if: github.repository == 'ValentineBSAA/TitleDeck'
    runs-on: ubuntu-latest
    steps:
      - name: Rename beta installer asset without altering its ZIP bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag='0.9.2-beta.1'
          old='TitleDeck-0.9.2-Beta1-Decky.zip'
          new='TitleDeck-0.9.2-beta.1.zip'
          expected='sha256:f1b9e4d915c8b1b13ac34c3b620cdd19770b01f9790636f0108b8c691f0a1812'

          gh release view "$tag" --repo "$repo" --json isPrerelease --jq '.isPrerelease' | grep -Fxq true
          old_id="$(gh api "repos/$repo/releases/tags/$tag" --jq ".assets[] | select(.name == \"$old\") | .id")"
          new_id="$(gh api "repos/$repo/releases/tags/$tag" --jq ".assets[] | select(.name == \"$new\") | .id")"
          if [[ -n "$old_id" && -n "$new_id" ]]; then
            echo 'Both installer assets exist, refusing an ambiguous release' >&2
            exit 1
          fi
          if [[ -n "$old_id" ]]; then
            digest="$(gh api "repos/$repo/releases/assets/$old_id" --jq '.digest')"
            test "$digest" = "$expected"
            gh api --method PATCH "repos/$repo/releases/assets/$old_id" -f name="$new" --silent
          elif [[ -z "$new_id" ]]; then
            echo 'Expected beta installer release asset not found' >&2
            exit 1
          fi

          gh api "repos/$repo/releases/tags/$tag" --jq '.assets[] | [.name, .digest] | @tsv'
          test "$(gh api "repos/$repo/releases/tags/$tag" --jq ".assets[] | select(.name == \"$new\") | .digest")" = "$expected"
          test "$(gh api "repos/$repo/releases/tags/$tag" --jq "[.assets[] | select(.name == \"$old\" or .name == \"$new\")] | length")" = 1

      - name: Mark 0.9.0 release candidate as prerelease, not stable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # 0.9.0 release ZIP has manifest version 0.9.0-rc.1.
          # Never advertise it as a compatible stable auto-update.
          gh release edit 0.9.0 --repo "$GITHUB_REPOSITORY" --prerelease
          gh release view 0.9.0 --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease' | grep -Fxq true
