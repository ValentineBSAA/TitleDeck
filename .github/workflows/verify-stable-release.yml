name: Verify published TitleDeck 0.9.2 installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'dist/**'
      - 'plugin.json'
      - 'package.json'
      - 'main.py'
      - 'tests/**'
      - '.github/workflows/verify-stable-release.yml'
permissions:
  contents: read
jobs:
  release-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frontend, backend and documentation tests
        run: |
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Download and verify published stable ZIP
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 1 --output /tmp/titledeck-stable.zip 'https://github.com/ValentineBSAA/TitleDeck/releases/download/0.9.2/TitleDeck-0.9.2.zip'
          echo '28fdbfc6f2d15f991bf98c7dc471d19be3142cd84269a9bba60d1147b420efdb  /tmp/titledeck-stable.zip' | sha256sum -c -
      - name: Inspect installer structure and compare runtime with repository
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, json
          repo = Path('.')
          archive = Path('/tmp/titledeck-stable.zip')
          with ZipFile(archive) as z:
              assert z.testzip() is None
              names = set(z.namelist())
              required = ['plugin.json','package.json','main.py','dist/index.js']
              assert all('TitleDeck/'+name in names for name in required)
              for name in ('plugin.json','package.json'):
                  bundled=json.loads(z.read('TitleDeck/'+name))
                  assert bundled['version']=='0.9.2'
              assert json.loads(z.read('TitleDeck/plugin.json'))['name']=='TitleDeck'
              mismatches=[]
              for p in required:
                  a=z.read('TitleDeck/'+p)
                  b=(repo/p).read_bytes()
                  if a != b:
                      mismatches.append(f'{p}: published_sha256={hashlib.sha256(a).hexdigest()} repo_sha256={hashlib.sha256(b).hexdigest()}')
              if mismatches:
                  print('Published ZIP/runtime mismatches:')
                  for line in mismatches:print(line)
                  raise SystemExit('Published release and repository code are not byte-identical')
              assert (repo/'src/index.js').read_bytes()==(repo/'dist/index.js').read_bytes()
              print('Stable release ZIP, version metadata, and all runtime files match current repository.')
          PY
