# Read-only historical verification; it must not demand that main equal 0.9.2
# after the new public release's source is synchronized.
name: Verify historical TitleDeck 0.9.2 download
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify existing historical 0.9.2 release ZIP
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --output /tmp/titledeck-092.zip 'https://github.com/ValentineBSAA/TitleDeck/releases/download/0.9.2/TitleDeck-0.9.2.zip'
          echo '28fdbfc6f2d15f991bf98c7dc471d19be3142cd84269a9bba60d1147b420efdb  /tmp/titledeck-092.zip' | sha256sum -c -
          python3 - <<'PY'
          from zipfile import ZipFile
          import json
          with ZipFile('/tmp/titledeck-092.zip') as z:
              assert z.testzip() is None
              assert json.loads(z.read('TitleDeck/plugin.json'))['version']=='0.9.2'
          print('Historical 0.9.2 ZIP verified. This does not check any newer source.')
          PY
