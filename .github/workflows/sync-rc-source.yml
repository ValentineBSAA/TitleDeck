name: Sync TitleDeck RC source after release upload
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'ValentineBSAA/TitleDeck' && (github.event_name == 'workflow_dispatch' || github.event.release.tag_name == '0.9.0-rc.1')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main source and documentation
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download maintainer-published RC ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 0.9.0-rc.1 --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP" --pattern 'TitleDeck-0.9.0-RC.zip'
      - name: Import exact verified source
        run: python3 scripts/import_rc_release.py "$RUNNER_TEMP/TitleDeck-0.9.0-RC.zip"
      - name: Run frontend and backend tests
        run: |
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -p test_backend.py
      - name: Commit source snapshot without overwriting website documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md main.py package.json plugin.json src dist tests
          if git diff --cached --quiet; then
            echo "RC source already synchronized"
          else
            git commit -m "Synchronize verified 0.9.0-rc.1 source and tests with release"
            git push origin HEAD:main
          fi
