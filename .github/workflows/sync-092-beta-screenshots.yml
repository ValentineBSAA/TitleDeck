name: Sync 0.9.2 Beta 1 screenshots

on:
  push:
    paths:
      - '.github/workflows/sync-092-beta-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and import released screenshot archive
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import urllib.request
          import zipfile
          import io
          import subprocess

          repo = 'ValentineBSAA/TitleDeck'
          url = 'https://github.com/' + repo + '/releases/download/0.9.2-beta.1/TitleDeck.V0.9.2.beta.1.Screenshots.zip'
          expected = 'd10bc897f1c932537fc95e64689dbb6a516b1d73c466fe5bd7cd4a2afb1bedef'
          with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'TitleDeck-release-gallery-sync'}), timeout=60) as r:
              data = r.read()
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'Screenshot asset SHA mismatch: {actual}')
          mapping = {
              'screenshot.jpeg': '01-quick-access-beta-version.jpeg',
              'Game Info 1.jpeg': '02-native-game-info-description.jpeg',
              'Game Info 2.jpeg': '03-long-description-end.jpeg',
          }
          dest = pathlib.Path('docs/screenshots/v0.9.2-beta1')
          dest.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              if z.testzip():
                  raise SystemExit('Screenshot ZIP integrity failed')
              for srcname, dstname in mapping.items():
                  matches = [p for p in z.namelist() if not p.startswith('__MACOSX/') and p.split('/')[-1] == srcname]
                  if len(matches) != 1:
                      raise SystemExit(f'Expected one screenshot: {srcname}; found {len(matches)}')
                  contents = z.read(matches[0])
                  if not contents.startswith(bytes.fromhex('ffd8ff')):
                      raise SystemExit(f'Not JPEG: {srcname}')
                  (dest / dstname).write_bytes(contents)
                  print(f'Imported {srcname} => {dstname} ({len(contents)} bytes)')
          # Keep the previous RC1 screenshots illustrating distinct workflows;
          # delete outdated/redundant images from the current gallery.
          for old in (
              'docs/screenshots/v0.9.0-rc1/01-quick-access-menu.jpeg',
              'docs/screenshots/v0.9.0-rc1/05-cleanup-no-change-feedback.jpeg',
              'docs/screenshots/v0.9.0-rc1/06-save-confirmation.jpeg',
              'docs/screenshots/v0.9.0-rc1/07-custom-title-draft.jpeg',
          ):
              pathlib.Path(old).unlink(missing_ok=True)
          PY
      - name: Commit gallery changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots already synchronized"
          else
            git commit -m "docs: import verified 0.9.2 beta screenshots and retire outdated images"
            git push origin HEAD:main
          fi
