name: TitleDeck 1.4.0 checks
on:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'src/**'
      - 'dist/**'
      - 'tests/**'
      - 'scripts/**'
      - 'assets/**'
      - 'plugin.json'
      - 'package.json'
      - 'README.md'
      - 'SOURCE.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'main.py'
      - 'src/**'
      - 'dist/**'
      - 'tests/**'
      - 'scripts/**'
      - 'plugin.json'
      - 'package.json'
      - 'README.md'
      - 'SOURCE.md'
      - 'docs/**'
      - '.github/workflows/validate.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    name: Tests / source parity / manifest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify synchronized version
        run: npm run version:check
      - name: JavaScript syntax and regression tests
        run: |
          node --check src/index.js
          node --check dist/index.js
          node --test --test-force-exit tests/*.test.cjs
      - name: Python syntax and regression tests
        run: |
          python3 -m py_compile main.py
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify checked-in source against the published 1.4.0 runtime hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,json
          src=Path('src/index.js').read_bytes()
          assert src==Path('dist/index.js').read_bytes()
          p=json.loads(Path('package.json').read_text())
          m=json.loads(Path('plugin.json').read_text())
          assert p['version']==m['version']=='1.4.0'
          assert m['name']=='TitleDeck' and m['api_version']==1
          assert Path(m['publish']['image']).is_file()
          content=Path('docs/RELEASE_SOURCE_SHA256_1.4.0.md').read_text()
          pairs=re.findall(r'\| `([^`]+)` \| `([0-9a-f]{64})` \|',content)
          assert len(pairs)==11, f'Expected 11 release runtime hashes, got {len(pairs)}'
          for name,digest in pairs:
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          print('Verified 1.4.0 runtime: 11 matching SHA-256 entries')
          PY
