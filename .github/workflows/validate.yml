name: TitleDeck checks
on:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'src/**'
      - 'dist/**'
      - 'tests/**'
      - 'plugin.json'
      - 'package.json'
      - 'README.md'
      - 'SOURCE.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'main.py'
      - 'src/**'
      - 'dist/**'
      - 'tests/**'
      - 'plugin.json'
      - 'package.json'
      - 'README.md'
      - 'SOURCE.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/validate.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    name: Frontend / backend / manifest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frontend tests
        run: node --test --test-force-exit tests/*.test.cjs
      - name: Backend tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check Decky version and bundle
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('plugin.json').read_text())
          b=json.loads(Path('package.json').read_text())
          assert a['name']=='TitleDeck' and a['api_version']==1
          assert a['version']==b['version']
          assert Path('src/index.js').read_bytes()==Path('dist/index.js').read_bytes()
          assert Path(a['publish']['image']).is_file()
          print('Validated TitleDeck',a['version'])
          PY
