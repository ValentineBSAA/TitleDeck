name: Synchronize published TitleDeck 0.9.2 beta source

on:
  push:
    paths:
      - '.github/workflows/sync-092-beta-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download exact published beta installer and synchronize runtime source
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import pathlib
          import urllib.request
          import zipfile

          url = 'https://github.com/ValentineBSAA/TitleDeck/releases/download/0.9.2-beta.1/TitleDeck-0.9.2-Beta1-Decky.zip'
          expected_zip = 'f1b9e4d915c8b1b13ac34c3b620cdd19770b01f9790636f0108b8c691f0a1812'
          request = urllib.request.Request(url, headers={'User-Agent':'TitleDeck-source-sync'})
          with urllib.request.urlopen(request, timeout=90) as response:
              data = response.read()
          digest = hashlib.sha256(data).hexdigest()
          assert digest == expected_zip, f'Installer ZIP SHA-256 mismatch: {digest}'

          entries = {
              'plugin.json': '4b1b765463c701ba9e19733af45f9c4021d20830043d400f0a6705133bab6815',
              'package.json': 'c407dff99544e901c9ad0add9554a821b287c902d31a49e9c60ac37bd2e65419',
              'main.py': 'bc539fd564297a7008677fbd12d8c39f029a1d9f15f557c2d00cd232993a2f26',
              'dist/index.js': '2a735efe47df5e35c72d26420bf485f718cc1ab7bd0a7f4063e171686025bf7c',
              'assets/titledeck-icon.png': '28e7ebc94db0be3ae4f8db174086db83e2aaf6ff68ec39183168e136da1c4ecf',
              'assets/titledeck-qam.webp': '2207ecd12639797f0b96a165fb24cfc51703cfef21c46d21509c5afae777af78',
          }
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              assert archive.testzip() is None, 'Damaged release ZIP'
              for name, expected in entries.items():
                  contents = archive.read('TitleDeck/' + name)
                  actual = hashlib.sha256(contents).hexdigest()
                  assert actual == expected, f'Unexpected bytes for {name}: {actual}'
                  out = pathlib.Path(name)
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(contents)
              frontend = archive.read('TitleDeck/dist/index.js')
              pathlib.Path('src/index.js').write_bytes(frontend)

          manifest = json.loads(pathlib.Path('plugin.json').read_text())
          pkg = json.loads(pathlib.Path('package.json').read_text())
          assert manifest['version'] == pkg['version'] == '0.9.2-beta.1'
          assert pathlib.Path('src/index.js').read_bytes() == pathlib.Path('dist/index.js').read_bytes()
          assert b'0.9.2-beta.1' in pathlib.Path('dist/index.js').read_bytes()
          print('Verified published beta ZIP and copied runtime source verbatim.')
          PY
      - name: Update release consistency tests
        shell: bash
        run: |
          cat > tests/release_metadata.test.cjs <<'EOF'
          const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.resolve(__dirname, '..');
          const json = p => JSON.parse(fs.readFileSync(path.join(root, p), 'utf8'));

          test('0.9.2 beta release metadata matches the packaged runtime', () => {
            const plugin = json('plugin.json');
            const pkg = json('package.json');
            assert.equal(plugin.name, 'TitleDeck');
            assert.equal(plugin.version, '0.9.2-beta.1');
            assert.equal(pkg.version, plugin.version);
            assert.equal(plugin.api_version, 1);
            const src = fs.readFileSync(path.join(root, 'src/index.js'), 'utf8');
            const dist = fs.readFileSync(path.join(root, 'dist/index.js'), 'utf8');
            assert.equal(src, dist);
            assert(src.includes('0.9.2-beta.1'));
          });

          test('public beta docs disclose hardware limits and long description advisory', () => {
            const readme = fs.readFileSync(path.join(root, 'README.md'), 'utf8');
            const changelog = fs.readFileSync(path.join(root, 'CHANGELOG.md'), 'utf8');
            for (const item of ['physical Steam Deck', 'ROG Ally', 'Android/DroidDeck', 'Game Info', '1,247']) {
              assert(readme.includes(item), item);
              assert(changelog.includes(item), item);
            }
          });
          EOF
      - name: Python syntax and documented version checks
        shell: bash
        run: |
          python3 -m py_compile main.py
          node --test tests/release_metadata.test.cjs
          python3 - <<'PY'
          from pathlib import Path
          assert '0.9.2-beta.1' in Path('dist/index.js').read_text()
          assert Path('src/index.js').read_bytes() == Path('dist/index.js').read_bytes()
          print('Runtime integrity verified')
          PY
      - name: Commit synchronized sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin.json package.json main.py src/index.js dist/index.js assets/titledeck-icon.png assets/titledeck-qam.webp tests/release_metadata.test.cjs
          if git diff --cached --quiet; then
            echo "Published beta source already synchronized"
          else
            git commit -m "build: sync verified 0.9.2 beta runtime with published installer"
            git push origin HEAD:main
          fi
