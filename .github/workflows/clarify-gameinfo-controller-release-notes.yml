name: Correct TitleDeck Game Info controller release notes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clarify-gameinfo-controller-release-notes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-notes:
    if: github.repository == 'ValentineBSAA/TitleDeck'
    runs-on: ubuntu-latest
    steps:
      - name: Correct issue #8 scope in two published release descriptions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view 1.1.8 --repo "$GITHUB_REPOSITORY" --json body --jq '.body' > /tmp/notes-118.md
          gh release view 1.1.9-preview.1 --repo "$GITHUB_REPOSITORY" --json body --jq '.body' > /tmp/notes-119-preview.md
          python3 - <<'PY'
          from pathlib import Path
          old118="**The right analog stick does not reliably scroll the Steam Game Info description area on either Steam or non-Steam titles in 1.1.8.** This is separate from successful description rendering and saved-state persistence, as well as Full Library Manager paging."
          new118="**The Steam Deck's built-in right stick does not scroll custom descriptions in Steam's Game Info tab for either Steam or non-Steam titles in 1.1.8. An external controller's right stick does scroll both types.** This input-device-specific issue is separate from successful description rendering, saved-state persistence, and Full Library Manager paging."
          old119="Steam's actual **Game Info** custom description area may still not scroll with the right stick for Steam or non-Steam games. **Issue #8** remains open. This preview does not claim to fix that separate behavior."
          new119="In Steam's actual **Game Info** tab, custom descriptions **scroll with an external controller's right stick** for Steam and non-Steam games, but **do not scroll with the Steam Deck's built-in right stick**. **Issue #8** tracks the built-in-input problem; this badge-only preview does not attempt to fix it."
          for fn,old,new in [('/tmp/notes-118.md',old118,new118),('/tmp/notes-119-preview.md',old119,new119)]:
              p=Path(fn)
              s=p.read_text()
              if s.count(old)!=1:
                  raise RuntimeError(f'Exact old phrase expected once in {fn}: found {s.count(old)}')
              result=s.replace(old,new)
              assert "external controller" in result
              assert "built-in right stick" in result
              p.write_text(result)
              print('Prepared accurate notes:',fn)
          PY
          gh release edit 1.1.8 --repo "$GITHUB_REPOSITORY" --notes-file /tmp/notes-118.md
          gh release edit 1.1.9-preview.1 --repo "$GITHUB_REPOSITORY" --notes-file /tmp/notes-119-preview.md
          for tag in 1.1.8 1.1.9-preview.1; do
            text="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
            echo "$text" | grep -F "external controller"
            echo "$text" | grep -F "built-in right stick"
          done
          echo 'Both public release descriptions corrected; release assets unchanged.'
