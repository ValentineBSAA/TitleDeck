name: Sync verified published TitleDeck 1.2.1 source
# 1.2.1 is already published by the maintainer. This only synchronizes source/tests.
# It never creates/edits releases, uploads new release assets, or rolls back releases.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-titledeck-121-published.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync-published-installer:
    if: github.repository == 'ValentineBSAA/TitleDeck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and cryptographically verify exactly published stable asset
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 3 --output /tmp/titledeck-121.zip 'https://github.com/ValentineBSAA/TitleDeck/releases/download/1.2.1/TitleDeck-1.2.1-Stable.zip'
          test "$(stat -c %s /tmp/titledeck-121.zip)" = "1957477"
          echo '95a6b3533c1d6588c5a3c936a7eca22a8c69f49cd2ed3e6f30126d47e1d0c6fb  /tmp/titledeck-121.zip' | sha256sum -c -
          python3 - <<'PY'
          import json
          from zipfile import ZipFile
          with ZipFile('/tmp/titledeck-121.zip') as z:
              assert z.testzip() is None
              assert json.loads(z.read('TitleDeck/plugin.json'))['version']=='1.2.1'
              assert json.loads(z.read('TitleDeck/package.json'))['version']=='1.2.1'
              assert z.read('TitleDeck/src/index.js')==z.read('TitleDeck/dist/index.js')
              print('Published 1.2.1 asset accepted for exact source synchronization')
          PY
      - name: Sync exact source bytes and update release-version test expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import hashlib
          with ZipFile('/tmp/titledeck-121.zip') as z:
              for rel in ('main.py','plugin.json','package.json','src/index.js','dist/index.js'):
                  path=Path(rel)
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(z.read('TitleDeck/'+rel))
                  print('Copied exact published file:',rel)
          # Preserve the historical regression suite, changing release pins only.
          for name in ('frontend.test.cjs','release_metadata.test.cjs','renamed_badge_overlay.test.cjs'):
              p=Path('tests')/name
              s=p.read_text()
              s=s.replace('1.1.9','1.2.1')
              if name=='release_metadata.test.cjs':
                  s=s.replace("for(const word of ['1.1.8'","for(const word of ['1.2.1'")
              p.write_text(s)
          p=Path('tests/test_repo_docs.py')
          t=p.read_text()
          old_digest='5a02b3cfec2bacfabf866cef47f566341a3b0d89950db0d9ff35a986cc66753b'
          assert t.count(old_digest)==1,'Unexpected source digest pin'
          digest=hashlib.sha256(Path('src/index.js').read_bytes()).hexdigest()
          t=t.replace('1.1.9','1.2.1').replace(old_digest,digest)
          p.write_text(t)
          print('Source hash verified:',digest)
          PY
      - name: Execute repository frontend/backend and documentation regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check src/index.js
          python3 -m py_compile main.py
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('plugin.json').read_text())['version']=='1.2.1'
          assert json.loads(Path('package.json').read_text())['version']=='1.2.1'
          assert Path('src/index.js').read_bytes()==Path('dist/index.js').read_bytes()
          PY
      - name: Commit only source and test synchronization, preserving public documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py plugin.json package.json src/index.js dist/index.js tests/frontend.test.cjs tests/release_metadata.test.cjs tests/renamed_badge_overlay.test.cjs tests/test_repo_docs.py
          if git diff --cached --quiet; then
            echo 'Already synchronized with the published 1.2.1 installer.'
          else
            git commit -m 'release: sync verified published 1.2.1 runtime and regression pins'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
