name: Complete TitleDeck 1.1.8 repository release refresh
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-titledeck-118.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    if: github.repository == 'ValentineBSAA/TitleDeck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact approved public installer and image archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3 -o /tmp/titledeck118.zip 'https://github.com/ValentineBSAA/TitleDeck/releases/download/1.1.8/TitleDeck-1.1.8.zip'
          echo '2bae38490fbbb7da783d98b33e8acd4dd6213f03ba1a7256807e60cb736f061c  /tmp/titledeck118.zip' | sha256sum -c -
          curl -fL --retry 5 --retry-delay 3 -o /tmp/titledeck118_images.zip 'https://github.com/ValentineBSAA/TitleDeck/releases/download/1.1.8/TitleDeck.1.1.8.screenshots.zip'
          echo '44fe0ed371c71ff241c0a30178320c9045e8c77eed10bda0f6a4bae92454eced  /tmp/titledeck118_images.zip' | sha256sum -c -
      - name: Copy public runtime and 23 curated screenshots into repository
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          from zipfile import ZipFile

          root=Path('.')
          with ZipFile('/tmp/titledeck118.zip') as z:
              assert z.testzip() is None, 'Installer CRC failed'
              for name in ['main.py','plugin.json','package.json','src/index.js','dist/index.js']:
                  b=z.read('TitleDeck/'+name)
                  p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
              assert json.loads((root/'plugin.json').read_text())['version']=='1.1.8'
              assert json.loads((root/'package.json').read_text())['version']=='1.1.8'
              assert (root/'src/index.js').read_bytes()==(root/'dist/index.js').read_bytes()
              p=root/'docs/PREVIEW24_SHA256.txt'
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(z.read('TitleDeck/docs/PREVIEW24_SHA256.txt'))
              # Keep the version-matched tests from the exact installer.
              for name in z.namelist():
                  if name.startswith('TitleDeck/tests/') and (name.endswith('.cjs') or name.endswith('.py')):
                      p=root/name.removeprefix('TitleDeck/')
                      p.parent.mkdir(parents=True,exist_ok=True)
                      p.write_bytes(z.read(name))

          names=[["Quick menu.jpeg","01-quick-access.jpeg"],["Full Library 1.jpeg","02-full-library-manager.jpeg"],["Full Library 2.jpeg","03-title-editor-overview.jpeg"],["Full Library 3.jpeg","04-description-editor-overview.jpeg"],["Change Title 1.jpeg","05-rename-game-actions.jpeg"],["Change Title 2.jpeg","06-description-editor-details.jpeg"],["Change Title .jpeg","07-native-steam-keyboard.jpeg"],["Search App Or app id.jpeg","08-search-title-or-id.jpeg"],["Search App ID.jpeg","09-search-app-id-keyboard.jpeg"],["Catherine classic 1.jpeg","10-steam-catherine-custom-game-info.jpeg"],["Catherine classic 2.jpeg","11-steam-catherine-game-info-bottom.jpeg"],["Catherine classic three.jpeg","12-steam-catherine-artwork-view.jpeg"],["NFS MW Custom Description non-steam game.jpeg","13-nonsteam-most-wanted-custom-game-info.jpeg"],["NFS MW Custom description non-steam game 2.jpeg","14-nonsteam-most-wanted-description-bottom.jpeg"],["Settings 1.jpeg","15-settings-title-replacements.jpeg"],["Settings 2.jpeg","16-settings-backup-restore.jpeg"],["Settings 3.jpeg","17-settings-recovery-hidden-tiles.jpeg"],["Settings 4.jpeg","18-settings-description-placement.jpeg"],["Settings 5.jpeg","19-settings-theme-accent.jpeg"],["Settings 6.jpeg","20-settings-right-stick-toggle.jpeg"],["Settings 7.jpeg","21-settings-color-presets.jpeg"],["Settings 8.jpeg","22-settings-custom-hex.jpeg"],["Settings 9.jpeg","23-settings-restore-all.jpeg"]]
          dest=root/'docs/screenshots/v1.1.8';dest.mkdir(parents=True,exist_ok=True)
          with ZipFile('/tmp/titledeck118_images.zip') as z:
              assert z.testzip() is None, 'Screenshot archive CRC failed'
              lookup={p.split('/')[-1]:p for p in z.namelist() if p.lower().endswith('.jpeg') and not p.startswith('__MACOSX/')}
              assert set(lookup)=={n for n,_ in names}, 'Unexpected screenshot filenames'
              for src,tgt in names:
                  image=z.read(lookup[src])
                  assert image[:3]==b'\\xff\\xd8\\xff' or image[:3]==bytes((255,216,255)),src
                  (dest/tgt).write_bytes(image)
              assert len(list(dest.glob('*.jpeg')))==23

          # Replace an obsolete private-preview documentation assertion with truthful public-release expectations.
          p=root/'tests/release_metadata.test.cjs'
          docs_test=p.read_text()
          marker="test('RC readme discloses physical Deck baseline, unsupported hardware and intermittent B bug',()=>{"
          assert marker in docs_test, 'Unexpected release metadata test version'
          docs_test=docs_test.split(marker)[0]+'''test('1.1.8 public documentation names hardware boundaries and known scrolling issue',()=>{
 const readme=fs.readFileSync(path.join(root,'README.md'),'utf8');
 const changelog=fs.readFileSync(path.join(root,'CHANGELOG.md'),'utf8');
 for(const item of ['1.1.8','Catherine Classic','Need for Speed','Steam Deck','Game Info','right-stick','unverified']) assert(readme.includes(item),item);
 assert(changelog.includes('1.1.8'));
});\n'''
          p.write_text(docs_test)

          # Synchronize source/version assertion without replacing this repo's documentation tests.
          p=root/'tests/test_repo_docs.py'
          s=p.read_text()
          s=s.replace('self.assertEqual(plugin["version"], "0.9.2")','self.assertEqual(plugin["version"], "1.1.8")')
          digest=hashlib.sha256((root/'src/index.js').read_bytes()).hexdigest()
          s=s.replace('91c813bb32d100408d48869b02b91256ed5ab92b5883c904c507d7505642f855',digest)
          p.write_text(s)
          print('Synchronized published 1.1.8 source SHA-256',digest)
          print('Synchronized all 23 images')
          PY
      - name: Run complete source and documentation tests
        run: |
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Commit source and individual images only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py plugin.json package.json src/index.js dist/index.js tests/ docs/PREVIEW24_SHA256.txt docs/screenshots/v1.1.8/
          if git diff --cached --quiet; then echo 'Already synchronized'; else
            git commit -m 'release: sync exact 1.1.8 runtime and publish curated 23-image gallery'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Apply release notes and remove screenshot archive release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit '1.1.8' --repo "$GITHUB_REPOSITORY" --notes-file docs/RELEASE_NOTES_1.1.8.md
          asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/1.1.8" --jq '.assets[] | select(.name=="TitleDeck.1.1.8.screenshots.zip") | .id')"
          if [ -n "$asset_id" ]; then
            # The gallery now contains all 23 individual image files.
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            echo 'Screenshot ZIP removed; official plugin ZIP preserved.'
          fi
          gh release view 1.1.8 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
