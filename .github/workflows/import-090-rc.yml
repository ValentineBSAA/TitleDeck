name: Import published TitleDeck 0.9.0 RC1 source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-090-rc.yml'
  release:
    types: [published, edited]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-rc:
    if: github.repository == 'ValentineBSAA/TitleDeck' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.release.tag_name == '0.9.0')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Download the already-published official RC1 installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/titledeck-rc1
          gh release download 0.9.0 --repo "$GITHUB_REPOSITORY" --dir /tmp/titledeck-rc1 --pattern 'TitleDeck-0.9.0-RC1-SteamDeck.zip'
      - name: Verify SHA-256 and import exact archive source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          import json

          path=Path('/tmp/titledeck-rc1/TitleDeck-0.9.0-RC1-SteamDeck.zip')
          expected='6bf8467b3637334ee21b3e50302be5d9ea15880ab80dbc27f190438bbc415c73'
          assert hashlib.sha256(path.read_bytes()).hexdigest()==expected, 'Uploaded ZIP does not match the approved 0.9.0 RC1 release'
          source=['main.py','plugin.json','package.json','CHANGELOG.md','src/index.js','dist/index.js',
                  'tests/frontend.test.cjs','tests/release_metadata.test.cjs','tests/test_backend.py']
          all_files=source+['README.md','LICENSE','assets/titledeck-icon.png','assets/titledeck-qam.webp']
          with ZipFile(path) as archive:
              assert archive.testzip() is None, 'ZIP CRC check failed'
              assert set(archive.namelist())=={'TitleDeck/'+x for x in all_files}, 'Unexpected ZIP contents'
              for filename in source:
                  obj=archive.getinfo('TitleDeck/'+filename)
                  assert 0<obj.file_size<5_000_000 and not obj.is_dir(), 'Unexpected source entry'
                  target=Path(filename)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(archive.read(obj))
              # Artwork is intentionally kept unchanged: compare against the published installer.
              for filename in ['assets/titledeck-icon.png','assets/titledeck-qam.webp']:
                  assert Path(filename).read_bytes()==archive.read('TitleDeck/'+filename), 'Artwork mismatch'
          plugin=json.loads(Path('plugin.json').read_text())
          package=json.loads(Path('package.json').read_text())
          assert plugin['name']=='TitleDeck' and plugin['api_version']==1
          assert plugin['version']==package['version']=='0.9.0-rc.1'
          assert Path('src/index.js').read_bytes()==Path('dist/index.js').read_bytes()
          print('Published ZIP, source files, assets, frontend and RC1 version verified')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the exact uploaded frontend and backend
        run: |
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -p test_backend.py
      - name: Commit only verified plugin source and regression tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py plugin.json package.json CHANGELOG.md src/index.js dist/index.js tests/frontend.test.cjs tests/release_metadata.test.cjs tests/test_backend.py
          if git diff --cached --quiet; then
            echo 'The public source already matches the uploaded RC1 ZIP.'
          else
            git commit -m 'Sync exact 0.9.0 RC1 source from published release ZIP'
            git push origin HEAD:main
          fi
