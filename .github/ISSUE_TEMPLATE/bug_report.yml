name: Bug report
description: Report Steam Deck behavior with reproducible steps
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Steam Deck Gaming Mode is the maintainer-tested target. 1.1.8 is a candidate; the published 0.9.2 has a known description issue. Please do not post credentials or private unredacted diagnostics."
  - type: input
    id: version
    attributes:
      label: TitleDeck version
      placeholder: "1.1.8 candidate, or 0.9.2 public"
    validations:
      required: true
  - type: dropdown
    id: hardware
    attributes:
      label: Hardware
      options:
        - Steam Deck OLED
        - Steam Deck LCD
        - Other handheld (unverified)
        - Desktop / laptop (unverified)
        - Android / DroidDeck (unverified)
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: SteamOS, Steam client, Decky Loader, and CSS Loader version/theme
      placeholder: "Include version/channel, or write unknown"
    validations:
      required: true
  - type: dropdown
    id: feature
    attributes:
      label: Affected feature / surface
      options:
        - Game Info description display or persistence
        - Steam Game Info description scrolling
        - TitleDeck custom description editor scrolling
        - Full Library Manager scrolling or LB/RB paging
        - Title rename, Suggest Cleanup, Save
        - Restore Original Game / description-only restore
        - Artwork source or tile sizing
        - Hide tile / hidden entry recovery
        - Settings / RGB color picker
        - Steam keyboard / controller focus
        - Backup and recovery
        - Other
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game name / App ID and Steam or non-Steam
      placeholder: "Catherine Classic (Steam), or imported shortcut (non-Steam)"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include physical buttons, connected controllers and exact page.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Screenshots or extra notes (redact personal information)
