name: Bug report
description: Report a TitleDeck behavior or compatibility problem
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **Important:** TitleDeck is built and tested for physical Valve Steam Deck / SteamOS Gaming Mode.
        ROG Ally, non-Valve SteamOS/SteamOS-like systems, Windows and Android/DroidDeck are unverified and may not work.
        Avoid passwords, authentication codes, or private account information.
  - type: input
    id: version
    attributes:
      label: TitleDeck version
      placeholder: "0.9.0-rc.1"
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device being tested
      options:
        - Valve Steam Deck (LCD)
        - Valve Steam Deck (OLED)
        - ASUS ROG Ally or other Windows handheld (unsupported/untested)
        - Other SteamOS / SteamOS-like hardware (unsupported/untested)
        - Windows desktop / Android / DroidDeck (unsupported/untested)
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: SteamOS / OS, Decky Loader, Steam client branch and CSS Loader theme
      placeholder: "Version numbers, Steam beta/stable, theme or none"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Feature affected
      options:
        - Display name persistence / refresh flicker
        - Native Steam keyboard / B dismissal animation
        - Four-way controller navigation
        - Suggest Cleanup / Undo Cleanup
        - Save / Restore Original / Restore All
        - Backups and recovery
        - Full library manager / Quick Access
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Exact reproduction steps
      description: Include each button pressed, whether Steam keyboard appeared, and what screen was visible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshot/video and extra details (no sensitive data)
