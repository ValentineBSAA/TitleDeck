name: Bug report
description: Report TitleDeck behavior on Steam Deck or another clearly identified test platform
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: "TitleDeck's primary tested platform is a physical Steam Deck in SteamOS Gaming Mode. As of October 28, 2026, TitleDeck 1.2.1 is the published stable release. Please include the exact version from your Quick Access badge, SteamOS version, game type and controller used. Please do not upload credentials or Steam Guard codes."
  - type: input
    id: version
    attributes:
      label: TitleDeck version
      placeholder: "e.g. 1.2.1 stable"
    validations:
      required: true
  - type: dropdown
    id: hardware
    attributes:
      label: Test hardware
      options:
        - Steam Deck OLED
        - Steam Deck LCD
        - ROG Ally / other handheld
        - Desktop / laptop
        - Android / DroidDeck
        - Other (describe)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: SteamOS / Steam client / Decky / CSS theme
      placeholder: "Include update channel and theme, if present"
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: Input device
      placeholder: "Built-in Steam Deck buttons, PS4 Bluetooth, touchscreen, etc."
  - type: dropdown
    id: feature
    attributes:
      label: Affected feature
      options:
        - Steam Game Info custom description
        - Non-Steam Game Info custom description
        - Game Info right-stick scrolling
        - Full Library Manager scrolling
        - LB/RB physical paging or D-pad
        - Library artwork / image sizing
        - Hide tile / restore hidden entries
        - Title renaming / Save / Suggest Cleanup
        - Restore Original / backup
        - Keyboard or UI theme
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the game name, App ID if known, and the exact actions/buttons.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Screenshots / other details
