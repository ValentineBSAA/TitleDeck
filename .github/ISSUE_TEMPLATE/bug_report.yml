name: Bug report
description: Report TitleDeck behavior; the physical Steam Deck is the only tested hardware target
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: "TitleDeck 0.9.2 stable is developed and tested on physical Steam Deck Gaming Mode. ROG Ally, other SteamOS-like systems, Windows, Android and Desktop Mode have not been verified. Please don't post credentials."
  - type: input
    id: version
    attributes:
      label: TitleDeck version
      placeholder: "0.9.2"
    validations:
      required: true
  - type: dropdown
    id: hardware
    attributes:
      label: Test hardware
      options:
        - Steam Deck OLED
        - Steam Deck LCD
        - ROG Ally / other PC handheld
        - Desktop / laptop
        - Android / DroidDeck
        - Other (describe)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: OS / Steam client / Decky / CSS Loader details
      placeholder: "Versions, update channel, theme (or none)"
    validations:
      required: true
  - type: dropdown
    id: feature
    attributes:
      label: Feature
      options:
        - Custom Game Info description / Steam tabs
        - Restore Original Game / description-only restore
        - Description length warning or scrolling
        - Game title display or persistence
        - Native Steam keyboard or animation
        - Library artwork / non-Steam app
        - Full library D-pad navigation / runtime filtering
        - Suggest Cleanup / undo
        - Backups / Restore All
        - Game Theme Music / other Decky plugin coexistence
        - UI theme or notifications
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include exact buttons, game and screen where observed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional screenshots and notes
