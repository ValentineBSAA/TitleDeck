name: Bug report
description: Report a reproducible TitleDeck 1.4.0 issue with your device and theme details
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Thank you for helping improve TitleDeck! The current public stable is 1.4.0. It is designed for Steam Deck Gaming Mode; other setups are not universally verified. Do not post Steam Guard codes, passwords or account tokens."
  - type: input
    id: version
    attributes:
      label: TitleDeck version
      placeholder: "1.4.0"
    validations:
      required: true
  - type: dropdown
    id: hardware
    attributes:
      label: Hardware
      options:
        - Steam Deck OLED
        - Steam Deck LCD
        - Other handheld
        - Desktop / laptop
        - Other (describe)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: SteamOS, Decky Loader and CSS Loader versions
      placeholder: "Include update channel and Art Hero version if installed"
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: Controller or input device
      placeholder: "Built-in controls, PS4 Bluetooth, touchscreen, etc."
  - type: dropdown
    id: feature
    attributes:
      label: Affected feature
      options:
        - Full Library Manager / navigation
        - Game title rename or restore
        - Game Info description
        - Game Info right-stick scrolling (issue #8)
        - Artwork loading / placeholders
        - Typography Studio / font or color
        - Steam Home Above / Below Cards
        - CSS Loader Art Hero read-only compatibility
        - Quick Access controller focus
        - Backup / recovery / hidden entries
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the game and exact sequence of buttons/settings involved.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Screenshots, extra details and theme interaction
      description: Note that Art Hero placement buttons are intentionally read-only while Art Hero is active.
