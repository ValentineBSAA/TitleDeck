name: Feature request
description: Suggest a focused TitleDeck improvement
title: "[Feature] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Main supported environment: physical Valve Steam Deck with SteamOS Gaming Mode. Requests for ROG Ally, alternative SteamOS, Windows and Android are experimental, not promised."
  - type: textarea
    id: reason
    attributes:
      label: What title, description, or library-management problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Desired behavior
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Expected impact on Gaming Mode navigation, backup safety, and Steam keyboard
