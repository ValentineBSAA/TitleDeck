name: Feature request
description: Suggest a focused improvement
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: reason
    attributes:
      label: What problem should TitleDeck solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Impact on controller navigation, title persistence and backup safety
